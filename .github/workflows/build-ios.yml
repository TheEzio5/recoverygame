name: Build iOS IPA (unsigned, for sideloading)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config
          pip install kivy-ios cython

      - name: Build Python + Kivy for iOS (slow, 30-60 min)
        run: toolchain build python3 kivy

      - name: Collect app sources
        run: |
          mkdir ios_src
          cp *.py ios_src/
          cp -R assets ios_src/assets

      - name: Create Xcode project
        run: toolchain create RecoveryQuest "$GITHUB_WORKSPACE/ios_src"

      - name: Set app icon
        run: |
          PROJDIR=$(ls -d *-ios | head -n 1)
          XCODEPROJ=$(find "$PROJDIR" -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          toolchain icon "$PROJDIR" assets/icon.png \
            || toolchain icon "$XCODEPROJ" assets/icon.png \
            || echo "Icon step failed, building with the default icon"

      - name: Build unsigned .app
        run: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Project: $PROJ  Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr RecoveryQuest.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RecoveryQuest-ipa
          path: RecoveryQuest.ipa
